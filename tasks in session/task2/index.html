<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero With Signup Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Raleway:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">

      <!-- Left side: text -->
      <div class="hero-text">
        <div class="logo">A<span>X</span></div>
        <h1>MODERN TEMPLATE<br>FOR BEAUTIFUL PROTOTYPES</h1>
        <hr>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean
          euismod bibendum laoreet. Proin gravida dolor sit amet lacus
          accumsan et viverra justo commodo.
        </p>
        <a href="#" class="btn-outline">Download</a>
      </div>

      <!-- Right side: form -->
      <form class="signup" action="#" method="post">
        <div class="signup-head">
          Try Your <span>FREE</span> Trial Today
        </div>

        <div class="signup-body">
          <input type="text" placeholder="Name">
          <input type="email" placeholder="Email">
          <input type="password" placeholder="Password">
        </div>

        <button type="submit">Get Started</button>
      </form>

    </div>
  </section>

</body>
</html>
